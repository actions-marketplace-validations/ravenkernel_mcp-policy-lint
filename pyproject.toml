[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-policy-lint"
version = "0.1.2"
description = "Read your MCP config before you run the server: zero-dependency policy lint, diff and CI gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "model-context-protocol", "mcp-servers", "linter", "policy",
            "policy-as-code", "ci", "static-analysis", "security", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# The whole point: zero runtime dependencies.
dependencies = []

[project.scripts]
mcplint = "mcplint.cli:main"

[project.urls]
Homepage = "https://github.com/ravenkernel/mcplint"
Issues = "https://github.com/ravenkernel/mcplint/issues"

[tool.setuptools.packages.find]
where = ["src"]
