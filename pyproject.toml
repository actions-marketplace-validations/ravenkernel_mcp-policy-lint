[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-policy-lint"
version = "0.2.0"
description = "Read your MCP config before you run the server: zero-dependency policy lint, diff and CI gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ravenkernel", email = "30620187+ravenkernel@users.noreply.github.com" }]
keywords = ["mcp", "model-context-protocol", "mcp-servers", "linter", "policy",
            "policy-as-code", "ci", "static-analysis", "security", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# The whole point: zero runtime dependencies.
dependencies = []

[project.scripts]
mcp-policy-lint = "mcp_policy_lint.cli:main"

[project.urls]
Homepage = "https://github.com/ravenkernel/mcp-policy-lint"
Repository = "https://github.com/ravenkernel/mcp-policy-lint"
Issues = "https://github.com/ravenkernel/mcp-policy-lint/issues"
Changelog = "https://github.com/ravenkernel/mcp-policy-lint/releases"

[tool.setuptools.packages.find]
where = ["src"]
